<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#34D399"/>
      <stop offset="0.75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 90) scale(420)">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 560) scale(460)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="#0B1120"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowL)"/>
  <rect width="1280" height="640" fill="url(#glowR)"/>
  <rect y="638" width="1280" height="2" fill="url(#rule)" opacity="0.8"/>

  <!-- logo mark -->
  <g transform="translate(96 178) scale(0.84375)">
    <rect x="8" y="8" width="240" height="240" rx="58" fill="#0E1830"/>
    <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M72 90 L116 128 L72 166" fill="none" stroke="url(#brand)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="98"  width="46" height="13" rx="6.5" fill="url(#brand)"/>
    <rect x="140" y="122" width="35" height="13" rx="6.5" fill="url(#brand)" opacity="0.66"/>
    <rect x="140" y="146" width="24" height="13" rx="6.5" fill="url(#brand)" opacity="0.38"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="338" y="292" font-family="'Segoe UI',-apple-system,'Helvetica Neue','Noto Sans',Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#F1F5F9">SaveCLI</text>
  <text x="341" y="338" font-family="'Segoe UI',-apple-system,'Helvetica Neue','Noto Sans',Arial,sans-serif" font-size="24" fill="#93A4BB">Full agent capability.</text>
  <text x="341" y="372" font-family="'Segoe UI',-apple-system,'Helvetica Neue','Noto Sans',Arial,sans-serif" font-size="24" fill="#93A4BB">Minimal footprint.</text>

  <!-- chips -->
  <g font-family="'Segoe UI',-apple-system,'Helvetica Neue','Noto Sans',Arial,sans-serif" font-size="18">
    <rect x="338" y="404" width="180" height="44" rx="22" fill="#121D31" stroke="#26364F"/>
    <circle cx="364" cy="426" r="4.5" fill="#34D399"/>
    <text x="380" y="432" fill="#C7D3E3">0 runtime deps</text>
    <rect x="534" y="404" width="210" height="44" rx="22" fill="#121D31" stroke="#26364F"/>
    <circle cx="560" cy="426" r="4.5" fill="#2DD4BF"/>
    <text x="576" y="432" fill="#C7D3E3">~350-token prompt</text>
    <rect x="338" y="460" width="162" height="44" rx="22" fill="#121D31" stroke="#26364F"/>
    <circle cx="364" cy="482" r="4.5" fill="#22D3EE"/>
    <text x="380" y="488" fill="#C7D3E3">no telemetry</text>
    <rect x="516" y="460" width="214" height="44" rx="22" fill="#121D31" stroke="#26364F"/>
    <circle cx="542" cy="482" r="4.5" fill="#34D399"/>
    <text x="558" y="488" fill="#C7D3E3">mission mode built-in</text>
  </g>

  <!-- terminal card -->
  <g filter="url(#cardShadow)">
    <rect x="772" y="150" width="444" height="352" rx="16" fill="#0D1626"/>
  </g>
  <rect x="772.5" y="150.5" width="443" height="351" rx="15.5" fill="none" stroke="#223350"/>
  <path d="M772 166 a16 16 0 0 1 16 -16 h412 a16 16 0 0 1 16 16 v26 h-444 z" fill="#111C30"/>
  <circle cx="804" cy="179" r="5.5" fill="#FF5F57"/>
  <circle cx="826" cy="179" r="5.5" fill="#FEBC2E"/>
  <circle cx="848" cy="179" r="5.5" fill="#28C840"/>
  <text x="994" y="184" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code','Noto Sans Mono',Consolas,monospace" font-size="13" fill="#54657E">savecli — 80×24</text>

  <g font-family="ui-monospace,'SF Mono','Cascadia Code','Noto Sans Mono',Consolas,monospace" font-size="16">
    <text x="800" y="236"><tspan fill="#7EE787">$ </tspan><tspan fill="#E6EDF3" font-weight="600">savecli</tspan></text>
    <text x="800" y="266" fill="#64748B">v0.1.0 · deepseek/deepseek-chat · cache on</text>
    <text x="800" y="308"><tspan fill="#22D3EE">❯ </tspan><tspan fill="#E6EDF3">fix the failing auth tests</tspan></text>
    <text x="800" y="338"><tspan fill="#64748B">› read   </tspan><tspan fill="#96B3D9">src/auth/session.ts</tspan></text>
    <text x="800" y="368"><tspan fill="#64748B">› edit   </tspan><tspan fill="#96B3D9">src/auth/session.ts</tspan><tspan fill="#34D399">  (+12 −3)</tspan></text>
    <text x="800" y="398"><tspan fill="#64748B">› bash   </tspan><tspan fill="#E6EDF3">npm test </tspan><tspan fill="#34D399">→ 133 passing</tspan></text>
    <path transform="translate(798 410) scale(0.72)" d="M13 2 L3 14 h7 l-1 8 L21 10 h-7 l1 -8 z" fill="#FBBF24"/>
    <text x="822" y="428" fill="#34D399">cached · 0 tokens</text>
    <text x="800" y="464" fill="#94A3B8">All auth tests pass. 1 file changed.</text>
  </g>

  <!-- bottom caption -->
  <text x="96" y="580" font-family="ui-monospace,'SF Mono','Cascadia Code','Noto Sans Mono',Consolas,monospace" font-size="17" fill="#54657E">npm install -g savecli · savecli setup · savecli</text>
</svg>
